[package]
name = "pcb-routing"
version = "0.1.0"
edition = "2021"
description = "Grid router for printed circuit boards: all nets routed together by negotiated congestion"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[profile.release]
opt-level = 3
debug = 1
